<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#b91c1c">
  <title>Är det mors dag idag?</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color-scheme: dark;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #b91c1c;
      color: #fff;
      transition: background-color 180ms ease;
    }

    main {
      width: min(92vw, 760px);
      padding: 3rem 1.5rem;
      text-align: center;
    }

    h1 {
      margin: 0 0 1.5rem;
      font-size: clamp(2rem, 7vw, 4.5rem);
      line-height: 1.05;
    }

    #answer {
      margin: 0;
      font-size: clamp(6rem, 30vw, 16rem);
      font-weight: 900;
      line-height: 0.9;
      letter-spacing: -0.06em;
    }
  </style>
</head>
<body>
  <main>
    <h1>Är det mors dag idag?</h1>
    <p id="answer" aria-live="polite">NEJ</p>
  </main>

  <script>
    function isSwedishMothersDay(date = new Date()) {
      const year = date.getFullYear();
      const lastDayOfMay = new Date(year, 5, 0);
      const lastSunday = new Date(year, 4, lastDayOfMay.getDate() - lastDayOfMay.getDay());

      return date.getFullYear() === lastSunday.getFullYear()
        && date.getMonth() === lastSunday.getMonth()
        && date.getDate() === lastSunday.getDate();
    }

    const yes = isSwedishMothersDay();
    const answer = document.querySelector("#answer");
    const background = yes ? "#15803d" : "#b91c1c";

    answer.textContent = yes ? "JA" : "NEJ";
    document.body.style.backgroundColor = background;
    document.querySelector('meta[name="theme-color"]').setAttribute("content", background);
  </script>
</body>
</html>
